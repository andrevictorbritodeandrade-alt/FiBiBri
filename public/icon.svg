<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="iconTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="iconGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background App Icon Shape with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#iconBg)"/>

  <!-- Subtle glow inner ring -->
  <circle cx="256" cy="256" r="190" stroke="#ffffff" stroke-width="2" opacity="0.15"/>

  <!-- Banking Crest Interlocking Ribbon Symbol (Bradesco / Banco do Brasil aesthetic) -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Primary Loop -->
    <path 
      d="M32 20 C22 28, 20 44, 28 56 L46 74 C50 78, 56 78, 60 74 L68 66 C72 62, 72 56, 68 52 L50 34 C44 28, 38 20, 32 20 Z" 
      fill="url(#iconTealGrad)"
    />
    <!-- Complementary Loop -->
    <path 
      d="M68 80 C78 72, 80 56, 72 44 L54 26 C50 22, 44 22, 40 26 L32 34 C28 38, 28 44, 32 48 L50 66 C56 72, 62 80, 68 80 Z" 
      fill="#ffffff"
      opacity="0.95"
    />
    <!-- Golden Core Bridge -->
    <path 
      d="M44 38 L56 50 L50 56 L38 44 C36 42, 38 38, 44 38 Z" 
      fill="url(#iconGoldGrad)"
    />
  </g>
</svg>
